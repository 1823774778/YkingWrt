name: Build YkingWrt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: owrt
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: arthur
            profile: jdcloud_re-ss-01
            model: JDCloud-AX1800-Pro
          - device: athena
            profile: jdcloud_re-cs-02
            model: JDCloud-AX6600
    name: Build ${{ matrix.model }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get -qq clean

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3-setuptools python3-dev \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl device-tree-compiler zstd

      - name: Clone upstream source
        run: git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: DIY part 1 (before feeds update)
        working-directory: openwrt
        env:
          DEVICE_PROFILE: ${{ matrix.profile }}
        run: bash "$GITHUB_WORKSPACE/scripts/diy-part1.sh"

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY part 2 (after feeds install)
        working-directory: openwrt
        env:
          DEVICE_PROFILE: ${{ matrix.profile }}
        run: bash "$GITHUB_WORKSPACE/scripts/diy-part2.sh"

      - name: Load device config
        working-directory: openwrt
        env:
          DEVICE_PROFILE: ${{ matrix.profile }}
        run: |
          cp "$GITHUB_WORKSPACE/configs/$DEVICE_PROFILE.config" .config
          make defconfig

      - name: Download packages
        working-directory: openwrt
        run: |
          make download -j8 || true
          find dl -size -1024c -exec rm -f {} \;
          make download -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: YkingWrt-${{ matrix.model }}
          path: openwrt/bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: YkingWrt build ${{ github.run_number }}
          files: |
            firmware/*.bin
            firmware/*.itb
            firmware/*.img.gz
            firmware/*.manifest